<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Questions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   Tokens
   ───────────────────────────────────────────────────────────── */
:root{
  --void:      #05030c;
  --nebula:    #1a0b33;
  --haze:      #6d3fd4;
  --orchid:    #b47bff;
  --starlight: #f3ecff;
  --dim:       rgba(243,236,255,.46);
  --hairline:  rgba(180,123,255,.22);
  --ember:     #c2182f;
  --ember-deep:#5e0a16;
  --tan:       #d2b48c;

  --display: 'Bodoni Moda','Didot','Bodoni MT',Georgia,'Times New Roman',serif;
  --body:    'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;

  --ease: cubic-bezier(.22,.61,.36,1);
  --sweep: cubic-bezier(.72,0,.28,1);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--starlight);
  font-family:var(--body);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  overscroll-behavior:none;
}

/* ─────────────────────────────────────────────────────────────
   Sky: starfield canvas + drifting nebulae
   ───────────────────────────────────────────────────────────── */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}

.nebulae{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(72px);
  mix-blend-mode:screen;
  will-change:transform;
}
.blob--a{
  width:52vmax;height:52vmax;left:-16vmax;top:-14vmax;opacity:.5;
  background:radial-gradient(circle at 50% 50%,#6d3fd4 0%,rgba(109,63,212,0) 66%);
  animation:driftA 38s ease-in-out infinite alternate;
}
.blob--b{
  width:44vmax;height:44vmax;right:-14vmax;bottom:-16vmax;opacity:.42;
  background:radial-gradient(circle at 50% 50%,#b47bff 0%,rgba(180,123,255,0) 64%);
  animation:driftB 47s ease-in-out infinite alternate;
}
.blob--c{
  width:34vmax;height:34vmax;left:38%;top:52%;opacity:.3;
  background:radial-gradient(circle at 50% 50%,#3b1a78 0%,rgba(59,26,120,0) 70%);
  animation:driftC 31s ease-in-out infinite alternate;
}
@keyframes driftA{
  0%  {transform:translate3d(0,0,0) scale(1)}
  50% {transform:translate3d(9vmax,7vmax,0) scale(1.14)}
  100%{transform:translate3d(-4vmax,12vmax,0) scale(.94)}
}
@keyframes driftB{
  0%  {transform:translate3d(0,0,0) scale(1.06)}
  50% {transform:translate3d(-11vmax,-6vmax,0) scale(.9)}
  100%{transform:translate3d(-3vmax,-14vmax,0) scale(1.18)}
}
@keyframes driftC{
  0%  {transform:translate3d(0,0,0) scale(.92)}
  100%{transform:translate3d(-16vmax,-9vmax,0) scale(1.22)}
}

/* ─────────────────────────────────────────────────────────────
   Stage
   ───────────────────────────────────────────────────────────── */
.stage{
  position:relative;z-index:2;
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(30px,6vh,58px);
  padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));
}

/* Constellation — one star per question, the fifth set apart */
.constellation{
  width:clamp(200px,42vw,268px);
  transition:opacity .7s var(--ease);
}
.constellation.is-gone{opacity:0}
.constellation svg{display:block;width:100%;height:auto;overflow:visible}
.c-track{fill:none;stroke:rgba(180,123,255,.16);stroke-width:1}
.c-lit{
  fill:none;stroke:var(--orchid);stroke-width:1;
  filter:drop-shadow(0 0 4px rgba(180,123,255,.9));
  transition:stroke-dashoffset 1s var(--ease);
}
.c-dot{fill:rgba(243,236,255,.16);transition:fill .5s var(--ease),filter .5s var(--ease)}
.c-dot.is-done{fill:var(--orchid);filter:drop-shadow(0 0 5px rgba(180,123,255,.95))}
.c-dot.is-now{fill:var(--starlight);filter:drop-shadow(0 0 7px rgba(243,236,255,.9))}
.c-dot--final{fill:rgba(243,236,255,.1);stroke:rgba(180,123,255,.34);stroke-width:1}

/* ─────────────────────────────────────────────────────────────
   Screen (swapped content)
   ───────────────────────────────────────────────────────────── */
.screen{
  width:100%;max-width:720px;
  text-align:center;
  transition:opacity .38s ease, transform .38s var(--ease), filter .38s ease;
}
.screen.is-out{opacity:0;transform:translateY(-16px);filter:blur(7px)}
.screen.is-in {animation:screenIn .62s var(--ease) both}
@keyframes screenIn{
  from{opacity:0;transform:translateY(20px);filter:blur(9px)}
  to  {opacity:1;transform:none;filter:blur(0)}
}

.eyebrow{
  margin:0 0 clamp(14px,2.4vh,22px);
  font-size:.7rem;font-weight:400;letter-spacing:.3em;text-transform:uppercase;
  color:var(--orchid);opacity:.78;
}
.question{
  margin:0;
  font-family:var(--display);font-weight:400;
  font-size:clamp(1.85rem,5vw,3.55rem);
  line-height:1.1;letter-spacing:-.012em;
  text-wrap:balance;
}
.hint{
  margin:14px 0 0;
  font-size:.82rem;letter-spacing:.06em;color:var(--dim);
}

/* Options — no boxes. A star, a label, a hairline that ignites. */
.options{
  margin:clamp(34px,5.5vh,56px) auto 0;
  display:grid;grid-template-columns:1fr 1fr;
  gap:2px clamp(24px,4vw,46px);
  max-width:620px;text-align:left;
}
.option{
  --glow:0;
  position:relative;
  display:flex;align-items:center;gap:14px;
  width:100%;padding:17px 6px;
  background:none;border:0;border-bottom:1px solid var(--hairline);
  color:var(--starlight);
  font-family:var(--body);font-size:clamp(.98rem,1.6vw,1.12rem);font-weight:300;
  letter-spacing:.01em;text-align:left;cursor:pointer;
  transition:color .3s var(--ease),border-color .3s var(--ease),padding-left .3s var(--ease),opacity .35s ease;
  animation:optIn .55s var(--ease) both;
  animation-delay:calc(.13s + var(--i) * .075s);
}
@keyframes optIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.option__star{
  flex:none;width:9px;height:9px;
  background:radial-gradient(circle,var(--orchid) 0%,rgba(180,123,255,0) 70%);
  border-radius:50%;
  transform:scale(.55);opacity:.4;
  transition:transform .3s var(--ease),opacity .3s var(--ease),box-shadow .3s var(--ease);
}
.option:hover,.option:focus-visible{
  outline:none;
  border-color:rgba(180,123,255,.7);
  padding-left:14px;
}
.option:hover .option__star,.option:focus-visible .option__star{
  transform:scale(1);opacity:1;
  box-shadow:0 0 12px 2px rgba(180,123,255,.75);
}
.option:focus-visible{color:#fff}
.option:focus-visible .option__label{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.options.is-locked .option{pointer-events:none}
.options.is-locked .option:not(.is-chosen){opacity:.22}
.option.is-chosen{border-color:var(--orchid);color:#fff;padding-left:14px}
.option.is-chosen .option__star{transform:scale(1);opacity:1;box-shadow:0 0 16px 3px rgba(180,123,255,.9)}

/* ─────────────────────────────────────────────────────────────
   Buttons (intro + the fifth question)
   ───────────────────────────────────────────────────────────── */
.actions{
  margin-top:clamp(36px,6vh,60px);
  display:flex;align-items:center;justify-content:center;
  gap:clamp(16px,3vw,30px);flex-wrap:wrap;
}
.btn{
  position:relative;
  padding:15px 38px;
  font-family:var(--body);font-size:.92rem;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;
  border-radius:999px;cursor:pointer;
  transition:transform .3s var(--ease),box-shadow .35s var(--ease),
             background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease);
}
.btn:focus-visible{outline:2px solid var(--starlight);outline-offset:4px}
.btn--yes{
  border:1px solid rgba(180,123,255,.55);
  background:linear-gradient(180deg,#8a54e8,#5f2fb8);
  color:#fff;
  box-shadow:0 0 0 rgba(180,123,255,0),0 12px 34px -14px rgba(138,84,232,.9);
}
.btn--yes:hover{transform:translateY(-2px);box-shadow:0 0 34px -2px rgba(180,123,255,.55),0 16px 40px -16px rgba(138,84,232,1)}
.btn--yes.is-breathing{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{
  0%,100%{box-shadow:0 0 18px -6px rgba(180,123,255,.5),0 12px 34px -14px rgba(138,84,232,.9)}
  50%    {box-shadow:0 0 40px 0 rgba(180,123,255,.6),0 12px 34px -14px rgba(138,84,232,.9)}
}
.btn--no{
  border:1px solid rgba(243,236,255,.26);
  background:transparent;color:var(--dim);
}
.btn--no:hover{border-color:rgba(243,236,255,.5);color:var(--starlight)}
.btn--no.is-fleeing{
  pointer-events:none;
  animation:flee 1.5s cubic-bezier(.35,.02,.7,1) forwards;
}
@keyframes flee{
  0%  {opacity:1;transform:translate3d(0,0,0) rotate(0) scale(1);filter:blur(0)}
  30% {opacity:.9;transform:translate3d(14px,-26px,0) rotate(9deg) scale(.92)}
  100%{opacity:0;transform:translate3d(120px,-190px,0) rotate(38deg) scale(.1);filter:blur(3px)}
}

/* The fifth question gets its own weight */
.question--final{
  font-style:italic;font-weight:500;
  font-size:clamp(2.3rem,7.4vw,5.1rem);
  line-height:1.02;letter-spacing:-.02em;
  color:var(--tan);
  text-shadow:0 0 70px rgba(210,180,140,.4);
}
.screen--wide{max-width:900px}
.closing{
  margin:22px auto 0;max-width:34ch;
  font-size:.94rem;line-height:1.65;color:var(--dim);
}

/* The two of us — only after the yes */
.screen--finale .question--final{
  font-size:clamp(1.95rem,5.4vw,3.7rem);
  line-height:1.06;
}
.screen--finale .closing{margin-top:18px;font-size:.98rem;max-width:38ch}

.gallery{
  display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(12px,2.2vw,24px);
  width:min(100%,600px,68vh);
  width:min(100%,600px,68svh);
  margin:clamp(22px,4.2vh,40px) auto 0;
}
.shot{
  margin:0;
  aspect-ratio:3/4;
  overflow:hidden;border-radius:4px;
  border:1px solid rgba(210,180,140,.3);
  box-shadow:0 24px 60px -30px rgba(0,0,0,.95);
  animation:shotIn .9s var(--ease) both;
}
.shot:nth-child(1){animation-delay:.3s}
.shot:nth-child(2){animation-delay:.48s}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes shotIn{
  from{opacity:0;transform:translateY(24px) scale(.97)}
  to  {opacity:1;transform:none}
}

/* ─────────────────────────────────────────────────────────────
   Curtain
   ───────────────────────────────────────────────────────────── */
.curtain{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.curtain[hidden]{display:none}
.curtain__panel{
  position:absolute;top:0;bottom:0;width:51%;
  z-index:2;
  background:
    linear-gradient(90deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 84%,rgba(0,0,0,.72) 100%),
    repeating-linear-gradient(90deg,
      var(--ember-deep) 0px,
      #8d1020 22px,
      var(--ember) 46px,
      #7e0c1c 70px,
      var(--ember-deep) 96px);
  box-shadow:inset 0 42px 70px -30px rgba(0,0,0,.75),
             inset 0 -60px 90px -40px rgba(0,0,0,.6);
  transition:transform 1.15s var(--sweep);
}
.curtain__panel--l{left:0;transform:translate3d(-101%,0,0)}
.curtain__panel--r{right:0;transform:translate3d(101%,0,0)}
.curtain.is-closed .curtain__panel--l,
.curtain.is-closed .curtain__panel--r{transform:translate3d(0,0,0)}
.curtain.is-open .curtain__panel--l{transform:translate3d(-101%,0,0);transition-duration:1.45s}
.curtain.is-open .curtain__panel--r{transform:translate3d(101%,0,0);transition-duration:1.45s}

.curtain__shine{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,225,225,.16) 50%,rgba(255,255,255,0) 60%);
  transform:translate3d(-60%,0,0);opacity:0;
}
.curtain.is-closed .curtain__shine{animation:shine 1.1s ease-out .16s both}
@keyframes shine{
  0%  {opacity:0;transform:translate3d(-60%,0,0)}
  35% {opacity:1}
  100%{opacity:0;transform:translate3d(60%,0,0)}
}

.curtain__valance{
  position:absolute;top:0;left:0;right:0;height:clamp(34px,6vh,58px);z-index:4;
  background:
    linear-gradient(180deg,#8d1020 0%,var(--ember-deep) 78%,#3d060e 100%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 18px,rgba(0,0,0,0) 18px 42px);
  border-bottom:1px solid rgba(217,164,65,.22);
  box-shadow:0 10px 26px -10px rgba(0,0,0,.9);
  transform:translate3d(0,-102%,0);
  transition:transform 1.15s var(--sweep);
}
.curtain.is-closed .curtain__valance{transform:translate3d(0,0,0)}
.curtain.is-open .curtain__valance{transform:translate3d(0,-102%,0);transition-duration:1.45s}

.burst{
  position:absolute;left:50%;top:50%;z-index:1;
  width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.85) 0%,rgba(180,123,255,.45) 26%,rgba(180,123,255,0) 62%);
  mix-blend-mode:screen;opacity:0;transform:scale(.18);
}
.burst.is-firing{animation:burst 1.5s ease-out forwards}
@keyframes burst{
  0%  {opacity:0;transform:scale(.12)}
  18% {opacity:.95;transform:scale(.5)}
  100%{opacity:0;transform:scale(1.35)}
}

/* ─────────────────────────────────────────────────────────────
   Confetti
   ───────────────────────────────────────────────────────────── */
#confetti{
  position:fixed;inset:0;z-index:50;pointer-events:none;
  width:100%;height:100%;opacity:0;
  transition:opacity .5s ease;
}
#confetti.is-live{opacity:1}

/* ─────────────────────────────────────────────────────────────
   Small screens
   ───────────────────────────────────────────────────────────── */
@media (max-width:620px){
  .options{grid-template-columns:1fr;gap:0;max-width:420px}
  .option{padding:15px 4px}
  .actions{gap:14px}
  .btn{padding:14px 30px;font-size:.85rem}
}

/* ─────────────────────────────────────────────────────────────
   Reduced motion
   ───────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion:reduce){
  .blob{animation:none}
  .option,.screen.is-in,.shot{animation:none}
  .btn--yes.is-breathing{animation:none}
  .curtain__panel,.curtain__valance{transition-duration:.45s !important}
  .curtain.is-open .curtain__panel--l,
  .curtain.is-open .curtain__panel--r,
  .curtain.is-open .curtain__valance{transition-duration:.55s !important}
  .curtain.is-closed .curtain__shine{animation:none}
  .btn--no.is-fleeing{animation-duration:.4s}
}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<div class="nebulae" aria-hidden="true">
  <span class="blob blob--a"></span>
  <span class="blob blob--b"></span>
  <span class="blob blob--c"></span>
</div>

<main class="stage">
  <div class="constellation" id="constellation" aria-hidden="true">
    <svg viewBox="0 0 268 46" role="presentation">
      <polyline class="c-track" points="10,32 72,14 134,28 196,12 256,26"/>
      <polyline class="c-lit" id="cLit" points="10,32 72,14 134,28 196,12 256,26"/>
      <g id="cDots"></g>
    </svg>
  </div>

  <div class="screen" id="screen" aria-live="polite"></div>
</main>

<div class="curtain" id="curtain" hidden>
  <div class="burst" id="burst"></div>
  <div class="curtain__panel curtain__panel--l"><span class="curtain__shine"></span></div>
  <div class="curtain__panel curtain__panel--r"><span class="curtain__shine"></span></div>
  <div class="curtain__valance"></div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  'use strict';

  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait   = ms => new Promise(r => setTimeout(r, REDUCE ? Math.min(ms, 260) : ms));

  /* ═══════════════════════════════════════════════════════════
     Content
     ═══════════════════════════════════════════════════════════ */
  const QUESTIONS = [
    {
      eyebrow: 'Warming up',
      text: 'How often do you think about history?',
      hint: 'times a day',
      options: ['1', '2', '3', '4+']
    },
    {
      eyebrow: 'Still warming up',
      text: 'How do you feel about history as a subject?',
      options: ['Very bad', 'Bad', 'Good', 'Very good']
    },
    {
      eyebrow: 'Now the actual history part',
      text: 'Who was the first president of the United States?',
      options: ['George Washington', 'Thomas Jefferson', 'Abraham Lincoln', 'Benjamin Franklin']
    },
    {
      eyebrow: 'Last easy one',
      text: 'In which year did the United States declare independence?',
      options: ['1492', '1776', '1812', '1865']
    }
  ];

  const screen        = document.getElementById('screen');
  const constellation = document.getElementById('constellation');
  const cLit          = document.getElementById('cLit');
  const cDots         = document.getElementById('cDots');
  const curtain       = document.getElementById('curtain');
  const burst         = document.getElementById('burst');

  /* ═══════════════════════════════════════════════════════════
     Constellation progress
     ═══════════════════════════════════════════════════════════ */
  const POINTS = [[10,32],[72,14],[134,28],[196,12],[256,26]];
  const SEG = POINTS.slice(1).map((p, i) => Math.hypot(p[0]-POINTS[i][0], p[1]-POINTS[i][1]));
  const TOTAL = SEG.reduce((a, b) => a + b, 0);

  POINTS.forEach(([x, y], i) => {
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', x);
    dot.setAttribute('cy', y);
    dot.setAttribute('r', i === 4 ? 5 : 3);
    dot.setAttribute('class', 'c-dot' + (i === 4 ? ' c-dot--final' : ''));
    cDots.appendChild(dot);
  });
  const dots = [...cDots.children];

  cLit.style.strokeDasharray = TOTAL;
  cLit.style.strokeDashoffset = TOTAL;

  // `index` = how many questions are answered; `active` = which one is on screen
  function setProgress(answered, active) {
    const lit = SEG.slice(0, answered).reduce((a, b) => a + b, 0);
    cLit.style.strokeDashoffset = TOTAL - lit;
    dots.forEach((d, i) => {
      d.classList.toggle('is-done', i < answered);
      d.classList.toggle('is-now', i === active);
    });
  }

  /* ═══════════════════════════════════════════════════════════
     Screen swapping
     ═══════════════════════════════════════════════════════════ */
  async function swap(html) {
    screen.classList.add('is-out');
    await wait(400);
    screen.innerHTML = html;
    screen.classList.remove('is-out', 'is-in');
    void screen.offsetWidth;          // restart the entrance animation
    screen.classList.add('is-in');
  }

  function optionsMarkup(options) {
    return `<div class="options">` + options.map((label, i) =>
      `<button class="option" type="button" style="--i:${i}" data-i="${i}">
         <span class="option__star" aria-hidden="true"></span>
         <span class="option__label">${label}</span>
       </button>`).join('') + `</div>`;
  }

  /* ═══════════════════════════════════════════════════════════
     Flow
     ═══════════════════════════════════════════════════════════ */
  function intro() {
    setProgress(0, -1);
    swap(`
      <p class="eyebrow">Five questions</p>
      <h1 class="question">A very short quiz about history.</h1>
      <p class="hint">Four of them are about history.</p>
      <div class="actions">
        <button class="btn btn--yes" type="button" id="begin">Begin</button>
      </div>
    `).then(() => {
      document.getElementById('begin').addEventListener('click', () => ask(0), { once: true });
    });
  }

  function ask(n) {
    const q = QUESTIONS[n];
    setProgress(n, n);
    swap(`
      <p class="eyebrow">${q.eyebrow}</p>
      <h1 class="question">${q.text}</h1>
      ${q.hint ? `<p class="hint">${q.hint}</p>` : ''}
      ${optionsMarkup(q.options)}
    `).then(() => {
      const list = screen.querySelector('.options');
      list.addEventListener('click', ev => {
        const btn = ev.target.closest('.option');
        if (!btn) return;
        list.classList.add('is-locked');
        btn.classList.add('is-chosen');
        setProgress(n + 1, -1);
        setTimeout(() => (n + 1 < QUESTIONS.length ? ask(n + 1) : theatre()), REDUCE ? 200 : 520);
      });
    });
  }

  /* ── The curtain ───────────────────────────────────────── */
  async function theatre() {
    // Fetch the photos now so they are decoded long before the yes
    ['images/IMG_4833.jpeg', 'images/IMG_5385.JPG'].forEach(src => { new Image().src = src; });

    constellation.classList.add('is-gone');
    screen.classList.add('is-out');
    await wait(420);

    curtain.hidden = false;
    void curtain.offsetWidth;
    curtain.classList.add('is-closed');        // sweep in
    await wait(1150);
    constellation.style.display = 'none';      // collapse it while the velvet hides the reflow
    await wait(750);                           // hold, velvet shimmers

    // Set the fifth question behind the closed curtain
    screen.innerHTML = `
      <h1 class="question question--final">Can I be your boyfriend?</h1>
      <div class="actions" id="finalActions">
        <button class="btn btn--yes is-breathing" type="button" id="yes">Yes</button>
        <button class="btn btn--no" type="button" id="no">No</button>
      </div>`;
    screen.classList.remove('is-out', 'is-in');
    screen.classList.add('screen--wide');
    void screen.offsetWidth;
    screen.classList.add('is-in');

    burst.classList.add('is-firing');
    curtain.classList.remove('is-closed');
    curtain.classList.add('is-open');          // part
    await wait(1450);

    curtain.hidden = true;
    curtain.classList.remove('is-open');
    burst.classList.remove('is-firing');

    wireFinal();
  }

  /* ── Yes / No ──────────────────────────────────────────── */
  function wireFinal() {
    const yes = document.getElementById('yes');
    const no  = document.getElementById('no');
    let gone = false;

    // The "No" drifts off into the stars — by timer, or the moment it's touched.
    function flee() {
      if (gone) return;
      gone = true;
      clearTimeout(timer);

      const before = yes.getBoundingClientRect();
      no.classList.add('is-fleeing');
      no.setAttribute('aria-hidden', 'true');
      no.disabled = true;

      setTimeout(() => {
        no.style.display = 'none';
        // FLIP: let "Yes" glide back to centre instead of snapping
        const after = yes.getBoundingClientRect();
        const dx = before.left - after.left;
        if (Math.abs(dx) > 0.5) {
          yes.style.transition = 'none';
          yes.style.transform = `translateX(${dx}px)`;
          void yes.offsetWidth;
          yes.style.transition = 'transform .7s var(--ease)';
          yes.style.transform = '';
        }
      }, REDUCE ? 400 : 1300);
    }

    const timer = setTimeout(flee, REDUCE ? 1200 : 2600);
    no.addEventListener('mouseenter', flee);
    no.addEventListener('click', flee);

    yes.addEventListener('click', () => {
      clearTimeout(timer);
      celebrate();
    }, { once: true });
  }

  async function celebrate() {
    confettiGo();
    screen.classList.add('is-out');
    await wait(500);
    screen.innerHTML = `
      <h1 class="question question--final">Best answer in recorded history.</h1>
      <p class="closing">Some dates are worth remembering. Today's especially.</p>
      <div class="gallery">
        <figure class="shot"><img src="images/IMG_4833.jpeg" width="1170" height="1560" alt="The two of us, late afternoon"></figure>
        <figure class="shot"><img src="images/IMG_5385.JPG" width="1204" height="1560" alt="The two of us, that night"></figure>
      </div>`;
    screen.classList.add('screen--finale');
    screen.classList.remove('is-out', 'is-in');
    void screen.offsetWidth;
    screen.classList.add('is-in');
  }

  /* ═══════════════════════════════════════════════════════════
     Starfield
     ═══════════════════════════════════════════════════════════ */
  (function sky() {
    const cv = document.getElementById('sky');
    const ctx = cv.getContext('2d');
    let w = 0, h = 0, stars = [], meteor = null, nextMeteor = 3000;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed();
    }

    function seed() {
      const count = Math.round((w * h) / 5200);
      stars = Array.from({ length: count }, () => {
        const depth = Math.random();
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.35 + depth * 1.25,
          a: 0.18 + depth * 0.62,
          phase: Math.random() * Math.PI * 2,
          speed: 0.6 + Math.random() * 1.4,
          depth,
          violet: Math.random() < 0.22
        };
      });
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);

      for (const s of stars) {
        if (!REDUCE) {
          s.x -= 0.016 + s.depth * 0.05;
          s.y += 0.008 + s.depth * 0.02;
          if (s.x < -2) s.x = w + 2;
          if (s.y > h + 2) s.y = -2;
        }
        const tw = REDUCE ? 1 : 0.62 + 0.38 * Math.sin(t * 0.0013 * s.speed + s.phase);
        ctx.globalAlpha = s.a * tw;
        ctx.fillStyle = s.violet ? '#c9a6ff' : '#f3ecff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (!REDUCE) {
        if (!meteor && t > nextMeteor) {
          meteor = {
            x: Math.random() * w * 0.75 + w * 0.2,
            y: Math.random() * h * 0.42,
            vx: -(4.6 + Math.random() * 2.4),
            vy: 2.1 + Math.random() * 1.1,
            life: 1
          };
        }
        if (meteor) {
          meteor.x += meteor.vx; meteor.y += meteor.vy; meteor.life -= 0.016;
          const tail = 15;
          const g = ctx.createLinearGradient(
            meteor.x, meteor.y,
            meteor.x - meteor.vx * tail, meteor.y - meteor.vy * tail);
          g.addColorStop(0, `rgba(243,236,255,${Math.max(meteor.life, 0) * 0.9})`);
          g.addColorStop(1, 'rgba(180,123,255,0)');
          ctx.globalAlpha = 1;
          ctx.strokeStyle = g;
          ctx.lineWidth = 1.4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(meteor.x, meteor.y);
          ctx.lineTo(meteor.x - meteor.vx * tail, meteor.y - meteor.vy * tail);
          ctx.stroke();
          if (meteor.life <= 0 || meteor.x < -80 || meteor.y > h + 80) {
            meteor = null;
            nextMeteor = t + 6000 + Math.random() * 9000;
          }
        }
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  })();

  /* ═══════════════════════════════════════════════════════════
     Confetti
     ═══════════════════════════════════════════════════════════ */
  function confettiGo() {
    const cv = document.getElementById('confetti');
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cv.classList.add('is-live');

    const COLORS = ['#b47bff', '#f3ecff', '#c2182f', '#ffd166', '#ff8ecb', '#8a54e8'];
    const bits = [];

    function spray(x, y, angle, spread, count, power) {
      for (let i = 0; i < count; i++) {
        const a = angle + (Math.random() - 0.5) * spread;
        const v = power * (0.55 + Math.random() * 0.7);
        bits.push({
          x, y,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v,
          w: 5 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.28,
          flutter: Math.random() * Math.PI * 2,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          life: 1
        });
      }
    }

    const dense = REDUCE ? 0.45 : 1;
    spray(0, h, -Math.PI / 3.1, 0.7, Math.round(90 * dense), 19);
    spray(w, h, -Math.PI + Math.PI / 3.1, 0.7, Math.round(90 * dense), 19);
    setTimeout(() => spray(w / 2, h * 0.34, -Math.PI / 2, Math.PI * 1.9, Math.round(70 * dense), 9), 260);

    let fading = false;
    setTimeout(() => (fading = true), 5200);

    (function tick() {
      ctx.clearRect(0, 0, w, h);
      for (let i = bits.length - 1; i >= 0; i--) {
        const b = bits[i];
        b.vy += 0.21;                       // gravity
        b.vx *= 0.992; b.vy *= 0.992;       // drag
        b.flutter += 0.16;
        b.x += b.vx + Math.sin(b.flutter) * 0.7;
        b.y += b.vy;
        b.rot += b.vr;
        if (fading) b.life -= 0.02;

        if (b.y > h + 40 || b.life <= 0) { bits.splice(i, 1); continue; }

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.scale(1, Math.abs(Math.cos(b.flutter)) * 0.85 + 0.15);   // ribbon tumble
        ctx.globalAlpha = Math.max(b.life, 0);
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      if (bits.length) requestAnimationFrame(tick);
      else cv.classList.remove('is-live');
    })();
  }

  intro();
})();
</script>
